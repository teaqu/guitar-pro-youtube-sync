name: Build Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run public Songsterr and YouTube smoke tests
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python-version: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run unit tests
        run: pytest -m "not integration and not slow" -v

  build:
    needs: test
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: guitar-pro-sync-linux-x86_64
            ffmpeg_ext: ""
            sep: ":"
          - os: macos-latest
            artifact_name: guitar-pro-sync-macos-arm64
            ffmpeg_ext: ""
            sep: ":"
          - os: macos-15-intel
            artifact_name: guitar-pro-sync-macos-x86_64
            ffmpeg_ext: ""
            sep: ":"
          - os: windows-latest
            artifact_name: guitar-pro-sync-windows-x86_64
            ffmpeg_ext: ".exe"
            sep: ";"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --upgrade pyinstaller -r requirements.txt

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Copy Deno runtime
        shell: bash
        run: |
          mkdir -p deno_bin
          cp "$(which deno)" "deno_bin/deno${{ matrix.ffmpeg_ext }}"
          "deno_bin/deno${{ matrix.ffmpeg_ext }}" --version

      - name: Set up FFmpeg (Linux/Windows)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      - name: Set up FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Copy FFmpeg binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ffmpeg_bin
          cp "$(which ffmpeg)" ffmpeg_bin/
          cp "$(which ffprobe)" ffmpeg_bin/

      - name: Copy FFmpeg binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ffmpeg_bin
          cp "$(which ffmpeg.exe)" ffmpeg_bin/
          cp "$(which ffprobe.exe)" ffmpeg_bin/

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --name "${{ matrix.artifact_name }}" \
            --add-data "assets${{ matrix.sep }}assets" \
            --collect-all yt_dlp_ejs \
            --add-binary "deno_bin/deno${{ matrix.ffmpeg_ext }}${{ matrix.sep }}deno_bin" \
            --add-binary "ffmpeg_bin/ffmpeg${{ matrix.ffmpeg_ext }}${{ matrix.sep }}ffmpeg_bin" \
            --add-binary "ffmpeg_bin/ffprobe${{ matrix.ffmpeg_ext }}${{ matrix.sep }}ffmpeg_bin" \
            main.py

      - name: Smoke-test packaged executable without host media tools
        shell: bash
        run: >-
          python scripts/check_executable.py
          "dist/${{ matrix.artifact_name }}${{ matrix.ffmpeg_ext }}"
          > packaged-self-test.log 2>&1

      - name: Upload packaged self-test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-self-test-log
          path: packaged-self-test.log
          if-no-files-found: ignore

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.artifact_name }}
          cd dist && zip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.exe

  live-test:
    name: Live public-service smoke test (${{ matrix.os }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_tests)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up FFmpeg (Linux/Windows)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      - name: Set up FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Run live public-service smoke test
        shell: bash
        run: python main.py --live-test > live-test.log 2>&1

      - name: Upload live-test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-${{ matrix.os }}-log
          path: live-test.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
